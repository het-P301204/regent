# Local stack: PostgreSQL + the REGENT API (which serves the built console).
#   cp .env.example .env    # set POSTGRES_PASSWORD
#   docker compose up --build
#   open http://127.0.0.1:8787
#
# Development with hot reload for the console as well:
#   docker compose --profile dev up --build      # console on http://127.0.0.1:5173
#
# PostgreSQL publishes no port: it is reachable only on the internal network.

name: regent

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: regent
      POSTGRES_USER: regent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regent -d regent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://regent:${POSTGRES_PASSWORD}@postgres:5432/regent
      REGENT_DEMO_MODE: ${REGENT_DEMO_MODE:-true}
      REGENT_COOKIE_SECURE: ${REGENT_COOKIE_SECURE:-false}
      REGENT_ALLOWED_ORIGINS: ${REGENT_ALLOWED_ORIGINS:-http://127.0.0.1:8787,http://localhost:8787,http://127.0.0.1:5173,http://localhost:5173}
      REGENT_ADMIN_EMAIL: ${REGENT_ADMIN_EMAIL:-}
      REGENT_ADMIN_PASSWORD: ${REGENT_ADMIN_PASSWORD:-}
      REGENT_LOG_LEVEL: ${REGENT_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    profiles: [dev]
    image: node:24.18-alpine3.22
    working_dir: /app/apps/web
    command: ["sh", "-c", "cd /app && npm ci --no-audit --no-fund && cd apps/web && npx vite"]
    environment:
      VITE_API_TARGET: http://api:8787
      VITE_HOST: 0.0.0.0
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

volumes:
  pgdata:
  web_node_modules:

networks:
  internal:
    internal: true
  edge: {}
