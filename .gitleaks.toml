# Extends the default rules. The only allowlisted values are the synthetic
# credential identifiers used by the demo dataset and scenarios (for example
# "svid-reply-03"): identifiers, not secrets. REGENT never stores credential material.
[extend]
useDefault = true

[allowlist]
description = "Synthetic credential identifiers in demo and scenario data"
regexTarget = "secret"
regexes = ['''^svid-[a-z]+(-[a-z0-9]+)*-[0-9]{2}$''']
